sonar.projectKey = jobSearchRust
sonar.projectName = jobSearchRust generated by jhipster

# Typescript tests files must be inside sources and tests, otherwise `INFO: Test execution data ignored for 80 unknown
# files, including:` is shown.
sonar.sources = src
sonar.tests = src
sonar.host.url = http://localhost:9001
sonar.sourceEncoding = UTF-8

sonar.test.inclusions = src/test/**/*.*, client/src/app/**/*.spec.ts
sonar.exclusions = client/src/content/**/*.*, client/src/i18n/*.ts, server/dist/static/**/*.*
sonar.javascript.lcov.reportPaths = tmp/test-results/lcov.info
sonar.testExecutionReportPaths = tmp/test-results/TESTS-results-sonar-vitest.xml

sonar.issue.ignore.multicriteria =
