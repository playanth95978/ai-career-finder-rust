# Docker Compose for jobSearchRust with PostgreSQL
version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: jobsearchrust-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobsearchrust
    ports:
      - '5432:5432'
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresql_data:
