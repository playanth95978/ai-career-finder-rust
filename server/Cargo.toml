[package]
name = "job_search_rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "job_search_rust"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
diesel.workspace = true
diesel_migrations.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_qs.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
argon2.workspace = true
rand.workspace = true
jsonwebtoken.workspace = true
validator.workspace = true
async-trait.workspace = true
lazy_static.workspace = true
regex.workspace = true
utoipa.workspace = true
utoipa-scalar.workspace = true
rig = { version = "0.42.0", features = ["derive"] }
# Appels REST vers l'API OCR Mistral (rustls : aucune dépendance C supplémentaire).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Reranking cross-encoder ONNX (bge-reranker-base), portage du RerankerService Java.
# `default-features = false` : on n'active pas `hf-hub`, le modele etant charge depuis le disque
# via `try_new_from_user_defined`, qui n'est pas derriere cette feature.
# `ort-download-binaries` fait recuperer la bibliotheque ONNX Runtime native a la compilation.
fastembed = { version = "4.9", default-features = false, features = ["ort-download-binaries"] }
# Extraction du texte des descriptions HTML des boards, et selecteurs CSS pour les sources
# sans API (HelloWork). Un parseur reel plutot qu'un retrait de balises par regex : les annonces
# scrapees contiennent des entites, des balises non fermees et des commentaires.
scraper = "0.20"
# Identite stable pour les sources sans identifiant (hash des invariants de l'annonce).
sha2 = "0.10"
hex = "0.4"
# Encodage des parametres de requete construits a la main.
urlencoding = "2"
# Combinateurs de flux pour le streaming SSE de l'assistant (rig expose des `Stream`).
futures = "0.3"
# Type vector(768) de pgvector, mappe pour Diesel.
pgvector = { version = "0.4", features = ["diesel"] }
tokio-cron-scheduler = { version = "0.15", default-features = false, features = ["signal"] }

[dev-dependencies]
axum-test = "14"
tempfile = "3"
# Phase 2a (2026-05-11): parametrized test cases for user_service sort
# branches. Documented decision (plan doc, locked 2026-05-10): rstest over
# 17 separate small `#[test]` functions sharing identical fixture setup —
# 80% less source-line count for no readability loss.
rstest = "0.21"
