<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-auto-apply-config-heading"
        data-cy="AutoApplyConfigCreateUpdateHeading"
        jhiTranslate="jobSearchRustApp.autoApplyConfig.home.createOrEditLabel"
      >
        Créer ou éditer un Auto Apply Config
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="form-label" for="field_id" jhiTranslate="global.field.id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        } @let userIdRef = editForm.get('userId')!;
        <div class="mb-3">
          <label class="form-label" for="field_userId" jhiTranslate="jobSearchRustApp.autoApplyConfig.userId">User Id</label>
          <input type="text" class="form-control" name="userId" id="field_userId" data-cy="userId" formControlName="userId" />
          @if (userIdRef.invalid && (userIdRef.dirty || userIdRef.touched)) {
          <div>
            @if (userIdRef.errors?.required) {
            <small class="form-text text-danger" jhiTranslate="entity.validation.required">Ce champ est obligatoire.</small>
            }
          </div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_mode" jhiTranslate="jobSearchRustApp.autoApplyConfig.mode">Mode</label>
          <select class="form-control" name="mode" formControlName="mode" id="field_mode" data-cy="mode">
            <option [ngValue]="null">{{ 'jobSearchRustApp.AutoApplyMode.null' | translate }}</option>
            @for (autoApplyMode of autoApplyModeValues; track $index) {
            <option [value]="autoApplyMode">{{ 'jobSearchRustApp.AutoApplyMode.' + autoApplyMode | translate }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_minScore" jhiTranslate="jobSearchRustApp.autoApplyConfig.minScore">Min Score</label>
          <input type="number" class="form-control" name="minScore" id="field_minScore" data-cy="minScore" formControlName="minScore" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_maxPerDay" jhiTranslate="jobSearchRustApp.autoApplyConfig.maxPerDay">Max Per Day</label>
          <input type="number" class="form-control" name="maxPerDay" id="field_maxPerDay" data-cy="maxPerDay" formControlName="maxPerDay" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_sources" jhiTranslate="jobSearchRustApp.autoApplyConfig.sources">Sources</label>
          <textarea class="form-control" name="sources" id="field_sources" data-cy="sources" formControlName="sources"></textarea>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
