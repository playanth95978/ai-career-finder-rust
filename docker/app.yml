# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: jobsearchrust
services:
  app:
    image: jobsearchrust
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - RUST_LOG=info
      - APP_ENV=development
      - DATABASE_URL=postgres://jobSearchRust@postgresql:5432/jobSearchRust
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-}
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/health
      interval: 5s
      timeout: 5s
      retries: 40
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql
